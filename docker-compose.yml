version: '3.8'
services:
  mongodb:
    image: mongo:6
    container_name: taskflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  app:
    build: .
    container_name: taskflow-app
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - JWT_SECRET=your_jwt_secret_here
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo-data: